<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ENG3A — Learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --green:#58cc02; --green-dark:#46a302; --green-light:#d7ffb8;
  --blue:#1cb0f6;  --blue-dark:#1899d6;  --blue-light:#ddf4ff;
  --red:#ff4b4b;   --red-dark:#d33131;   --red-light:#ffdfe0;
  --yellow:#ffc800;--yellow-dark:#e5a000;--yellow-light:#fff4cc;
  --purple:#ce82ff;--purple-dark:#a568cc;--purple-light:#f3e4ff;
  --orange:#ff9600;--orange-dark:#e08600;
  --border:#e5e5e5; --border-dark:#cfcfcf;
  --text:#3c3c3c; --muted:#afafaf; --bg:#f0f2f5;
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-full:999px;
  --font:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--font);background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;display:flex;justify-content:center;
  align-items:center;padding:24px;
}
button{font-family:inherit}

/* ============================================================
   FRAME
   ============================================================ */
.app-frame{
  width:440px;max-width:100%;height:min(880px,calc(100vh - 48px));
  background:#fff;border-radius:28px;overflow:hidden;position:relative;
  box-shadow:0 30px 70px rgba(20,30,50,.18), 0 0 0 1px rgba(0,0,0,.05);
}
@media (max-width:540px){
  body{padding:0;align-items:stretch}
  .app-frame{width:100%;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;overflow-anchor:none}
.scroll::-webkit-scrollbar{width:7px}
.scroll::-webkit-scrollbar-thumb{background:#dcdcdc;border-radius:99px}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  border:none;cursor:pointer;border-radius:var(--r-md);
  font-weight:800;letter-spacing:.8px;text-transform:uppercase;
  transition:transform .07s ease, box-shadow .07s ease, filter .15s, background .15s;
  font-size:15px;
}
.btn:active{transform:translateY(4px);box-shadow:none !important}
.btn-check{
  width:100%;padding:16px 22px;background:var(--green);color:#fff;
  box-shadow:0 4px 0 var(--green-dark);
}
.btn-check:hover:not([disabled]){filter:brightness(1.06)}
.btn-check[disabled]{
  background:#e5e5e5;color:#afafaf;box-shadow:none;cursor:not-allowed;transform:none;
}
.btn-continue{
  padding:13px 26px;background:#fff;color:var(--green-dark);
  box-shadow:0 4px 0 rgba(0,0,0,.12);font-size:14px;flex-shrink:0;
}
.fb-wrong .btn-continue{color:var(--red-dark)}

/* ============================================================
   PATH SCREEN
   ============================================================ */
.top-hud{
  display:flex;align-items:center;gap:14px;
  padding:16px 18px 14px;border-bottom:1px solid #f2f2f2;
  background:#fff;position:relative;z-index:5;
}
.chip{
  display:flex;align-items:center;gap:5px;font-weight:800;font-size:15px;
  color:var(--text);white-space:nowrap;
}
.chip .emoji{font-size:17px;line-height:1}
.chip.hearts{color:var(--red)}
.spacer{flex:1}

.path-scroll{padding:22px 18px 40px}

.unit{margin-bottom:8px}
.unit-banner{
  width:100%;max-width:340px;margin:14px auto 32px;
  color:#fff;border-radius:var(--r-md);padding:14px 18px;
  position:relative;
}
.unit-banner .eyebrow{
  font-size:11px;font-weight:800;letter-spacing:1.2px;
  text-transform:uppercase;opacity:.85;
}
.unit-banner h3{margin:4px 0 0;font-size:18px;font-weight:900;line-height:1.25}

.node-row{
  display:flex;justify-content:center;margin-bottom:24px;position:relative;
  transition:transform .25s ease;
}
.node{
  width:70px;height:70px;border-radius:50%;border:none;
  display:grid;place-items:center;font-size:26px;font-weight:900;
  cursor:pointer;position:relative;color:#fff;
  transition:transform .08s, box-shadow .08s, filter .15s;
}
.node:active:not([disabled]){transform:translateY(5px);box-shadow:none !important}
.node.done{background:var(--green);box-shadow:0 6px 0 var(--green-dark);font-size:28px}
.node.current{background:var(--green);box-shadow:0 6px 0 var(--green-dark)}
.node.current::before{
  content:'';position:absolute;inset:-9px;border-radius:50%;
  border:3px solid rgba(88,204,2,.35);animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{transform:scale(1);opacity:.9}
  50%{transform:scale(1.09);opacity:.3}
}
.node.locked{
  background:#e5e5e5;box-shadow:0 6px 0 #cfcfcf;color:#b5b5b5;
  cursor:not-allowed;font-size:22px;
}
.node-tip{
  position:absolute;bottom:82px;left:50%;transform:translateX(-50%);
  background:#fff;border:2px solid var(--border);border-radius:var(--r-sm);
  padding:7px 14px;font-size:11.5px;font-weight:900;color:var(--green-dark);
  letter-spacing:1px;text-transform:uppercase;white-space:nowrap;
  animation:bob 1.8s ease-in-out infinite;pointer-events:none;
}
.node-tip::after{
  content:'';position:absolute;bottom:-7px;left:50%;width:10px;height:10px;
  background:#fff;border-right:2px solid var(--border);
  border-bottom:2px solid var(--border);
  transform:translateX(-50%) rotate(45deg);
}
@keyframes bob{0%,100%{margin-bottom:0}50%{margin-bottom:6px}}

.bottomnav{
  display:flex;border-top:2px solid var(--border);background:#fff;
  padding:8px 4px 10px;
}
.bottomnav a{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;
  color:var(--muted);text-decoration:none;padding:6px 0;border-radius:var(--r-sm);
}
.bottomnav a .emoji{font-size:21px;line-height:1;filter:grayscale(1);opacity:.5}
.bottomnav a.active{color:var(--green-dark);background:var(--green-light)}
.bottomnav a.active .emoji{filter:none;opacity:1}

/* ============================================================
   LESSON SCREEN
   ============================================================ */
.lesson-hud{
  display:flex;align-items:center;gap:14px;
  padding:16px 18px;background:#fff;position:relative;z-index:5;flex-shrink:0;
}
.icon-btn{
  background:none;border:none;font-size:20px;color:var(--muted);
  cursor:pointer;padding:2px 6px;line-height:1;font-weight:800;
}
.icon-btn:hover{color:#7a8291}
.progress{
  flex:1;height:16px;background:var(--border);border-radius:var(--r-full);
  overflow:hidden;position:relative;
}
.progress-fill{
  height:100%;border-radius:var(--r-full);
  background:linear-gradient(#7ee63a,#58cc02);
  position:relative;transition:width .35s cubic-bezier(.4,0,.2,1);
}
.progress-fill::after{
  content:'';position:absolute;top:4px;left:8px;right:8px;height:4px;
  border-radius:99px;background:rgba(255,255,255,.45);
}
.hud-hearts{display:flex;align-items:center;gap:4px;font-weight:900;font-size:16px;color:var(--red)}
.hud-hearts.shake{animation:shake .4s}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-5px)}
  75%{transform:translateX(5px)}
}

.lesson-scroll{flex:1;overflow-y:auto;padding:26px 22px 30px;overflow-anchor:none}
.lesson-scroll .option,.lesson-scroll .chip-word,.lesson-scroll .match-item{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.lesson-scroll::-webkit-scrollbar{width:7px}
.lesson-scroll::-webkit-scrollbar-thumb{background:#dcdcdc;border-radius:99px}

.q-prompt{
  font-size:22px;font-weight:900;line-height:1.35;margin:0 0 22px;
  letter-spacing:-.2px;
}
.q-prompt .kicker{
  display:block;font-size:12.5px;font-weight:800;color:var(--muted);
  letter-spacing:1px;text-transform:uppercase;margin-bottom:9px;
}
.q-prompt em{font-style:normal;color:var(--blue-dark)}

.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.options.single{grid-template-columns:1fr}
.option{
  background:#fff;border:2px solid var(--border);border-bottom-width:4px;
  border-radius:var(--r-md);padding:16px 14px;font-size:15.5px;font-weight:800;
  color:var(--text);cursor:pointer;text-align:center;transition:.12s;
  line-height:1.3;
}
.option:hover{background:#fafafa}
.option.selected{
  border-color:#84d8ff;background:var(--blue-light);color:var(--blue-dark);
}
.option.multi.selected{
  border-color:#84d8ff;background:var(--blue-light);color:var(--blue-dark);
}
.option .box{
  display:inline-block;width:18px;height:18px;border:2px solid var(--border-dark);
  border-radius:5px;margin-right:9px;vertical-align:-3px;position:relative;
}
.option.multi.selected .box{background:var(--blue);border-color:var(--blue)}
.option.multi.selected .box::after{
  content:'✓';position:absolute;inset:0;color:#fff;font-size:13px;
  display:grid;place-items:center;line-height:1;
}
.option .box{display:none}
.option.multi .box{display:inline-block}

/* fill in the blank */
.blank{
  display:inline-block;min-width:104px;padding:2px 12px;
  border-bottom:3px solid var(--blue);color:var(--blue-dark);
  text-align:center;font-weight:900;transition:.15s;
}
.blank.empty{color:transparent;border-bottom-style:dashed}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.chip-word{
  background:#fff;border:2px solid var(--border);border-bottom-width:4px;
  border-radius:var(--r-md);padding:12px 18px;font-size:15px;font-weight:800;
  cursor:pointer;transition:.12s;color:var(--text);
}
.chip-word:hover{background:#fafafa}
.chip-word.selected{
  border-color:#84d8ff;background:var(--blue-light);color:var(--blue-dark);
}
.chip-word.used{opacity:.35;pointer-events:none}

/* match */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match-col{display:flex;flex-direction:column;gap:10px}
.match-item{
  background:#fff;border:2px solid var(--border);border-bottom-width:4px;
  border-radius:var(--r-md);padding:13px 12px;font-size:14px;font-weight:800;
  cursor:pointer;text-align:left;transition:.12s;color:var(--text);line-height:1.3;
}
.match-item:hover:not(.matched){background:#fafafa}
.match-item.selected{border-color:#84d8ff;background:var(--blue-light);color:var(--blue-dark)}
.match-item.matched{
  border-color:var(--green);background:var(--green-light);color:var(--green-dark);
  pointer-events:none;cursor:default;
}
.match-item.wrong{
  border-color:var(--red);background:var(--red-light);color:var(--red-dark);
  animation:shake .35s;
}

/* footer */
.lesson-footer{flex-shrink:0;border-top:2px solid var(--border);background:#fff}
.footer-bar{padding:16px 22px 22px}
.feedback{
  padding:18px 22px 22px;display:flex;align-items:flex-start;gap:16px;
}
.feedback.fb-correct{background:var(--green-light)}
.feedback.fb-wrong{background:var(--red-light)}
.fb-text{flex:1;min-width:0}
.fb-text strong{
  display:block;font-size:17px;font-weight:900;margin-bottom:4px;
}
.fb-correct .fb-text strong{color:var(--green-dark)}
.fb-wrong .fb-text strong{color:var(--red-dark)}
.fb-text span{font-size:14px;font-weight:700;line-height:1.45;color:#5b6472}
.fb-icon{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  font-size:19px;flex-shrink:0;background:#fff;
}
.fb-correct .fb-icon{color:var(--green-dark)}
.fb-wrong .fb-icon{color:var(--red-dark)}

/* ============ BRUTALIST HOME (PATHFIT ref) ============ */
.home-bar{background:#1b2440;color:#fff;display:flex;align-items:center;gap:10px;padding:14px;font-weight:900;letter-spacing:1px}
.home-bar button{background:none;border:none;color:#fff;font-size:20px;font-weight:900;cursor:pointer}
.home-bar .t{margin-left:auto;font-size:15px;letter-spacing:2px}
.home-scroll{flex:1;overflow-y:auto;background:#e9f1e2;padding:14px 14px 30px;overflow-anchor:none}
.home-frame{border:3px solid #111;border-radius:18px;background:#f4f6ec;padding:18px 14px;box-shadow:4px 4px 0 #111}
.home-eyebrow{font-family:'Courier New',monospace;font-weight:900;letter-spacing:3px;font-size:13px}
.home-h1{font-size:44px;line-height:.95;font-weight:900;margin:8px 0 4px;letter-spacing:-1px}
.home-sub{font-family:'Courier New',monospace;font-weight:700;font-size:17px;margin-bottom:14px}
.menu-card{display:flex;gap:12px;align-items:flex-start;background:#fff;border:3px solid #111;border-radius:16px;padding:16px 14px;margin:12px 0;box-shadow:0 5px 0 #111;cursor:pointer;text-align:left;width:100%}
.menu-card:active{transform:translateY(3px);box-shadow:0 1px 0 #111}
.menu-card.green{background:#4be000}
.menu-card h3{margin:0;font-size:23px;font-weight:900;letter-spacing:-.3px;color:#111;-webkit-text-stroke:.45px #111;paint-order:stroke fill}
.menu-card p{margin:4px 0 0;font-family:'Courier New',monospace;font-weight:700;font-size:14px}
.menu-ico{width:52px;height:52px;border:3px solid #111;border-radius:12px;display:grid;place-items:center;font-size:24px;font-weight:900;background:#fff;flex-shrink:0}
.photo-row{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px}
.photo-slot{min-width:150px;height:100px;border:3px solid #111;border-radius:12px;background:#fff;display:grid;place-items:center;overflow:hidden;position:relative;cursor:pointer;box-shadow:0 4px 0 #111;padding:0}
.photo-slot img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.photo-slot span{font-size:11px;font-weight:900;text-align:center;padding:6px;position:relative;z-index:1}
.photo-slot input{display:none}
.unit-pick{background:#fff;border:3px solid #111;border-radius:16px;padding:14px;margin-top:12px;box-shadow:0 5px 0 #111}
.unit-pick h4{margin:0 0 10px;font-family:'Courier New',monospace;letter-spacing:2px;font-size:13px}
.unit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.unit-btn{border:3px solid #111;border-radius:12px;padding:12px;font-weight:900;font-family:'Courier New',monospace;font-size:16px;background:#eef2e6;cursor:pointer;box-shadow:0 4px 0 #111}
.unit-btn.sel{background:#4be000}
.lesson-row{display:flex;gap:10px;align-items:center;background:#fff;border:3px solid #111;border-radius:12px;padding:12px;box-shadow:0 4px 0 #111;cursor:pointer;width:100%;margin-top:10px;text-align:left}
.lessons-list{display:flex;flex-direction:column;gap:2px}
/* slides (PATHFIT ref: progress + clip + cards + back/continue) */
.clip-row{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.slide-progress{flex:1;height:18px;border:3px solid #111;border-radius:99px;background:#fff;overflow:hidden}
.slide-progress > div{height:100%;background:#4be000;transition:width .3s}
.clip-chip{border:3px solid #111;border-radius:10px;background:#fff;font-family:'Courier New',monospace;font-weight:900;font-size:11px;padding:6px 8px;box-shadow:0 3px 0 #111;white-space:nowrap}
.slide-title-card{background:#fff;border:3px solid #111;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 5px 0 #111}
.slide-title-card .eyebrow{font-family:'Courier New',monospace;font-weight:900;letter-spacing:3px;font-size:12px}
.slide-title-card h2{margin:6px 0;font-size:26px;font-weight:900;letter-spacing:-.5px;line-height:1.05}
.slide-title-card p{margin:0;font-weight:700;font-size:15px;color:#3c3c3c}
.slide-body-card{background:#fff;border:3px solid #111;border-radius:16px;padding:14px;box-shadow:0 5px 0 #111;margin-bottom:12px}
.slide-body-card h3{margin:0 0 8px;font-size:22px;font-weight:900;color:#3c3c3c;letter-spacing:-.3px;line-height:1.1}
.slide-body-scroll{max-height:300px;overflow-y:auto;padding-right:4px;overflow-anchor:none}
.slide-footer-bar{flex-shrink:0;padding:10px 14px 16px;background:#e9f1e2;border-top:3px solid #111}
.slide-body-scroll ul{margin:0;padding-left:20px}
.slide-body-scroll li{margin-bottom:10px;font-weight:700;font-size:15.5px;line-height:1.55;color:#3c3c3c}
.slide-footer{display:flex;gap:10px}
.slide-btn{flex:1;border:3px solid #111;border-radius:12px;padding:13px;font-weight:900;font-family:'Courier New',monospace;font-size:14px;letter-spacing:1px;cursor:pointer;box-shadow:0 4px 0 #111;background:#fff;color:#999}
.slide-btn.go{background:#4be000;color:#111}
.slide-btn:active{transform:translateY(2px);box-shadow:none}
.slide-btn[disabled]{opacity:.6;cursor:not-allowed;transform:none}
/* slide + question transitions (duolingo-style fade/slide) */
@keyframes slideFadeR{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}
@keyframes slideFadeL{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.anim-r{animation:slideFadeR .28s ease both}
.anim-l{animation:slideFadeL .28s ease both}
.anim-up{animation:fadeUp .22s ease both}
.slide-body-scroll li{animation:fadeUp .25s ease both}
.slide-body-scroll li:nth-child(2){animation-delay:.05s}
.slide-body-scroll li:nth-child(3){animation-delay:.1s}
.slide-body-scroll li:nth-child(4){animation-delay:.15s}
.slide-body-scroll li:nth-child(n+5){animation-delay:.2s}
@media (prefers-reduced-motion: reduce){.anim-r,.anim-l,.anim-up,.slide-body-scroll li{animation:none}}

/* ============================================================
   COMPLETE SCREEN
   ============================================================ */
.complete-wrap{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:36px 26px;gap:24px;
  position:relative;overflow:hidden;
}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti span{
  position:absolute;width:9px;height:9px;border-radius:2px;opacity:.85;
  animation:fall 3.2s linear infinite;
}
@keyframes fall{
  from{transform:translateY(-30px) rotate(0)}
  to{transform:translateY(880px) rotate(540deg)}
}
.trophy{
  font-size:82px;line-height:1;
  filter:drop-shadow(0 12px 20px rgba(255,200,0,.45));
  animation:pop .55s cubic-bezier(.2,1.6,.5,1) both;
}
@keyframes pop{from{transform:scale(.35);opacity:0}to{transform:scale(1);opacity:1}}
.complete-wrap h2{
  margin:0;font-size:28px;font-weight:900;color:var(--yellow-dark);
  letter-spacing:-.4px;
}
.complete-wrap p{margin:0;font-weight:800;color:#8b93a1;font-size:15px}
.stat-tiles{display:flex;gap:12px;width:100%;max-width:340px}
.stat-tile{
  flex:1;border-radius:var(--r-md);padding:11px 6px 10px;border:2px solid var(--border);
  background:#fff;
}
.stat-tile .label{
  display:block;font-size:10px;font-weight:900;letter-spacing:.9px;
  text-transform:uppercase;color:#8b93a1;
}
.stat-tile .value{display:block;font-size:19px;font-weight:900;margin-top:3px}
.stat-tile.xp{border-color:var(--yellow);background:var(--yellow-light)}
.stat-tile.xp .value{color:var(--yellow-dark)}
.stat-tile.time{border-color:var(--blue);background:var(--blue-light)}
.stat-tile.time .value{color:var(--blue-dark)}
.stat-tile.acc{border-color:var(--green);background:var(--green-light)}
.stat-tile.acc .value{color:var(--green-dark)}
.complete-actions{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}

/* ============================================================
   OVERLAY
   ============================================================ */
.overlay{
  position:absolute;inset:0;background:rgba(20,25,35,.55);
  display:grid;place-items:center;padding:28px;z-index:60;
  animation:fade .2s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.overlay-card{
  background:#fff;border-radius:var(--r-lg);padding:28px 24px;
  text-align:center;max-width:330px;width:100%;
  box-shadow:0 24px 50px rgba(0,0,0,.3);
}
.overlay-card .big{font-size:52px;line-height:1;margin-bottom:10px}
.overlay-card h3{margin:0 0 8px;font-size:21px;font-weight:900;color:var(--red)}
.overlay-card p{margin:0 0 22px;font-weight:700;color:#7a8291;font-size:14px;line-height:1.5}
.overlay-card .btn-check{background:var(--red);box-shadow:0 4px 0 var(--red-dark)}
</style>
</head>
<body>
<div class="app-frame" id="app"></div>

<script>
/* ============================================================
   1. COURSE CONTENT  —  built from the 4 lecture files
   ============================================================ */
const COURSE = [
  {
    id:'u1', section:'Lecture 1', color:'#58cc02', colorDark:'#46a302',
    title:'Communication Process, Principles and Ethics',
    lessons:[
      {
        id:'u1l1', icon:'📣', title:'What Is Communication?',
        questions:[

const STORAGE_KEY = 'pc-lesson-progress-v1';

const state = {
  view:'home',
  selectedUnit:'u1',
  homePhotos:{},
  hearts:5,
  gems:480,
  streak:12,
  xp:0,
  completed:new Set(),
  session:null
};

const app = document.getElementById('app');

/* ---------- persistence ---------- */
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      completed:[...state.completed],
      xp:state.xp,
      streak:state.streak,
      gems:state.gems,
      hearts:state.hearts
    }));
  }catch(e){}
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    state.completed = new Set(d.completed || []);
    state.xp        = d.xp || 0;
    state.streak    = d.streak || 12;
    state.gems      = d.gems || 480;
    state.hearts    = (typeof d.hearts === 'number') ? d.hearts : 5;
  }catch(e){}
}

/* ---------- helpers ---------- */
function allLessons(){
  const out = [];
  COURSE.forEach(u => u.lessons.forEach(l => out.push({...l, unitId:u.id})));
  return out;
}
function findLesson(id){
  for(const u of COURSE) for(const l of u.lessons) if(l.id === id) return {...l, unitId:u.id};
  return null;
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function fmtTime(ms){
  const s = Math.round(ms/1000);
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}

function buildLongSets(){
  const lists = [MOCK.u1, MOCK.u2, MOCK.u3, MOCK.u4];
  const maxLen = Math.max(lists[0].length, lists[1].length, lists[2].length, lists[3].length);
  let combined = [];
  for(let i=0;i<maxLen;i++){ for(let k=0;k<4;k++){ if(lists[k][i]) combined.push(lists[k][i]); } }
  const per = Math.ceil(combined.length / 4);
  return [combined.slice(0,per), combined.slice(per,per*2), combined.slice(per*2,per*3), combined.slice(per*3)];
}

function collectUnitQuestions(uid, n){
  const u = unitById(uid); let all = [];
  u.lessons.forEach(function(l){ l.questions.forEach(function(q){ all.push(q); }); });
  for(let i=all.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const tmp=all[i]; all[i]=all[j]; all[j]=tmp; }
  return all.slice(0, n || all.length);
}
function shortBankFor(q){
  const DIST = ['always','never','only','people','time','very','without','clearly','truly','because'];
  function wds(s){ return (s||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(function(x){return !!x;}); }
  const seen = {}; const bank = [];
  function add(w){ w=(w||'').trim(); if(!w) return; const k=w.toLowerCase(); if(!seen[k]){ seen[k]=1; bank.push(w); } }
  (q.keywords||[]).forEach(add);
  (q.keywords||[]).forEach(function(k){ wds(k).forEach(function(w){ if(w.length>1) add(w); }); });
  wds(q.model).forEach(add);
  DIST.forEach(function(w){ if(bank.length < 12) add(w); });
  return shuffle(bank).slice(0,12);
}
function prepQuestions(list){
  return list.map(function(o){
    const q = {}; for(const k in o){ const v = o[k]; q[k] = (v instanceof Array) ? v.slice() : v; }
    if(q.pairs) q.pairs = o.pairs.map(function(p){ return p.slice(); });
    if(q.type === 'mc' && q.options){
      const idx = q.options.map(function(_,i){ return i; });
      for(let i=idx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=idx[i]; idx[i]=idx[j]; idx[j]=t; }
      q.options = idx.map(function(i){ return o.options[i]; });
      q.answer = idx.indexOf(o.answer);
    } else if(q.type === 'multi' && q.options){
      const idx = q.options.map(function(_,i){ return i; });
      for(let i=idx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=idx[i]; idx[i]=idx[j]; idx[j]=t; }
      q.options = idx.map(function(i){ return o.options[i]; });
      q.answers = o.answers.map(function(a){ return idx.indexOf(a); });
    } else if(q.type === 'fill' && q.bank){
      const b = q.bank.slice();
      for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=b[i]; b[i]=b[j]; b[j]=t; }
      q.bank = b;
    } else if(q.type === 'tf'){
      const arr = [true,false];
      for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
      q._tfOrder = arr;
    } else if(q.type === 'short'){
      q._bank = shortBankFor(o);
    } else if(q.type === 'match' && q.pairs){
      const order = q.pairs.map(function(_,i){ return i; });
      for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=order[i]; order[i]=order[j]; order[j]=t; }
      q.pairs = order.map(function(i){ return o.pairs[i].slice(); });
    }
    return q;
  });
}

function startUnitLessons(uid){
  const u = unitById(uid);
  let qs = [];
  u.lessons.forEach(function(l){ l.questions.forEach(function(q){ qs.push(q); }); });
  state.session = { lessonId:u.lessons[0].id, lessonIds:u.lessons.map(function(l){ return l.id; }), lessonTitle:u.title, questions:prepQuestions(qs), index:0, correctCount:0, startedAt:Date.now(), selected:null, multiSel:[], selectedWord:null, shortText:'', matched:{}, matchSel:null, matchRightOrder:[], matchWrong:null, checked:false, correct:false, explain:'', heartShake:false };

  resetQuestionState(); state.view='lesson'; render();
}

function renderLesson(){
  const s = state.session;
  const q = s.questions[s.index];
  const pct = (s.index / s.questions.length) * 100;

  app.innerHTML = `
    <div class="screen">
      <header class="lesson-hud">
        <button class="icon-btn" data-action="close-lesson" aria-label="Quit lesson">✕</button>
        <div class="progress"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="hud-hearts ${s.heartShake ? 'shake' : ''}">❤️ <span>${state.hearts}</span></div>
      </header>
      <div class="scroll lesson-scroll anim-up" id="lesson-scroll">
        ${renderQuestion(q)}
      </div>
      <footer class="lesson-footer">
        ${renderFooter()}
      </footer>
    </div>
  `;

  s.heartShake = false;
}

function renderQuestion(q){
  let body = '';

  if(q.type === 'mc'){
    body = `<div class="options single">
      ${q.options.map((o,i) => `
        <button class="option ${state.session.selected === i ? 'selected' : ''}"
                data-action="pick" data-index="${i}">${o}</button>
      `).join('')}
    </div>`;
  }

  else if(q.type === 'tf'){
    const order = q._tfOrder || [true,false];
    body = `<div class="options single">
      ${order.map((val) => `
        <button class="option ${state.session.selected === val ? 'selected' : ''}"
                data-action="pick-tf" data-value="${val}">${val ? 'True' : 'False'}</button>
      `).join('')}
    </div>`;
  }

  else if(q.type === 'multi'){
    body = `<div class="options single">
      ${q.options.map((o,i) => `
        <button class="option multi ${state.session.multiSel.includes(i) ? 'selected' : ''}"
                data-action="pick-multi" data-index="${i}">
          <span class="box"></span>${o}
        </button>
      `).join('')}
    </div>`;
  }

  else if(q.type === 'fill'){
    const word = state.session.selectedWord;
    body = `
      <div class="chips">
        ${q.bank.map(w => `
          <button class="chip-word ${word === w ? 'selected' : ''}"
                  data-action="pick-word" data-word="${w}">${w}</button>
        `).join('')}
      </div>`;
  }

  else if(q.type === 'short'){
    const v = state.session.shortText || '';
    const bank = q._bank || shortBankFor(q);
    q._bank = bank;
    body = '<div><textarea id="short-input" rows="1" enterkeyhint="done" placeholder="Type your answer… or tap the word buttons below" style="width:100%;border:3px solid #111;border-radius:12px;padding:10px 12px;font-family:monospace;font-weight:700;font-size:14px;resize:none">'+v+'</textarea>'
      + '<div class="chips">'
      + bank.map(function(w){ return '<button class="chip-word" data-action="short-chip" data-word="'+w+'">'+w+'</button>'; }).join('')
      + '</div></div>';
  }

  else if(q.type === 'match'){
    const st = state.session;
    body = `
      <div class="match-grid">
        <div class="match-col">
          ${q.pairs.map((p,i) => {
            const isMatched = st.matched[i] !== undefined;
            const isSel = st.matchSel === i;
            return `<button class="match-item ${isMatched ? 'matched' : ''} ${isSel ? 'selected' : ''}"
                            data-action="match-left" data-index="${i}"
                            ${isMatched ? 'disabled' : ''}>${p[0]}</button>`;
          }).join('')}
        </div>
        <div class="match-col">
          ${st.matchRightOrder.map(item => {
            const isMatched = Object.values(st.matched).includes(item);
            const isWrong = st.matchWrong === item;
            return `<button class="match-item ${isMatched ? 'matched' : ''} ${isWrong ? 'wrong' : ''}"
                            data-action="match-right" data-word="${item}"
                            ${isMatched ? 'disabled' : ''}>${item}</button>`;
          }).join('')}
        </div>
      </div>`;
  }

  /* prompt line */
  let promptHTML;
  if(q.type === 'fill'){
    const word = state.session.selectedWord;
    const stem = (q.prompt || '').split('______').join('…');
    promptHTML = `
      <h2 class="q-prompt">
        <span class="kicker">${q.kicker}</span>
        ${stem}
      </h2>
      <h2 class="q-prompt" style="font-size:19px;margin-top:-8px;">
        ${q.before}<span class="blank ${word ? '' : 'empty'}">${word || '​'}</span>${q.after}
      </h2>`;
  } else {
    promptHTML = `
      <h2 class="q-prompt">
        <span class="kicker">${q.kicker}</span>
        ${q.prompt}
      </h2>`;
  }

  return promptHTML + body;
}

function renderFooter(){
  const s = state.session;

  if(s.checked){
    const cls  = s.correct ? 'fb-correct' : 'fb-wrong';
    const icon = s.correct ? '✓' : '✕';
    const head = s.correct ? 'Nice work!' : 'Not quite';
    return `
      <div class="feedback ${cls}">
        <div class="fb-icon">${icon}</div>
        <div class="fb-text">
          <strong>${head}</strong>
          <span>${s.explain || ''}</span>
        </div>
        <button class="btn btn-continue" data-action="continue">Continue</button>
      </div>`;
  }

  const q = s.questions[s.index];
  let ready = false;
  if(q.type === 'mc' || q.type === 'tf') ready = s.selected !== null;
  else if(q.type === 'multi')            ready = s.multiSel.length > 0;
  else if(q.type === 'fill')             ready = s.selectedWord !== null;
  else if(q.type === 'short')            ready = true;

  return `
    <div class="footer-bar">
      <button class="btn btn-check" data-action="check" ${ready ? '' : 'disabled'}>Check</button>
    </div>`;
}

                          animation-duration:${(2.4+Math.random()*1.8).toFixed(2)}s;

    <div class="screen">

            <span class="label">Accuracy</span>
            <span class="value">${acc}%</span>
          </div>

function render(){
  if(state.view === 'home'){ renderHome(); return; }
  if(state.view === 'lessons'){ renderLessonsList(); return; }
  if(state.view === 'slides'){ renderSlides(); return; }
  if(state.view === 'lesson' && state.session){
    renderLesson();
  } else if(state.view === 'complete' && state.session){
    renderComplete();
  } else {
    renderHome();
  }
}

/* ============================================================
   7. LESSON SESSION LOGIC
   ============================================================ */
function startLesson(lessonId){
  const lesson = findLesson(lessonId);
  if(!lesson) return;

  state.session = {
    lessonId,
    lessonTitle: lesson.title,
    questions: prepQuestions(lesson.questions),
    index: 0,
    correctCount: 0,
    startedAt: Date.now(),
    /* per-question state */
    selected: null,
    multiSel: [],
    selectedWord: null,
    shortText: '',
    matched: {},
    matchSel: null,
    matchRightOrder: [],
    matchWrong: null,
    checked: false,
    correct: false,
    explain: '',
    heartShake: false
  };

  if(state.hearts <= 0) state.hearts = 5;   /* demo refill */
  resetQuestionState();
  state.view = 'lesson';
  render();
}

function resetQuestionState(){
  const s = state.session;
  const q = s.questions[s.index];
  s.selected     = null;
  s.multiSel     = [];
  s.selectedWord = null;
  s.shortText    = '';
  s.matched      = {};
  s.matchSel     = null;
  s.matchWrong   = null;
  s.checked      = false;
  s.correct      = false;
  s.explain      = q.explain || '';

  if(q.type === 'match'){
    s.matchRightOrder = shuffle(q.pairs.map(p => p[1]));
  }
}

function checkAnswer(){
  const s = state.session;
  const q = s.questions[s.index];
  let correct = false;

  if(q.type === 'mc' || q.type === 'tf'){
    correct = s.selected === q.answer;
  } else if(q.type === 'multi'){
    const a = [...s.multiSel].sort().join(',');
    const b = [...q.answers].sort().join(',');
    correct = a === b;
  } else if(q.type === 'fill'){
    correct = s.selectedWord === q.answer;
  } else if(q.type === 'short'){
    const inp = document.getElementById('short-input');
    const val = (inp ? inp.value : (s.shortText||'')).toLowerCase();
    s.shortText = val;
    let hits = 0;
    (q.keywords||[]).forEach(function(k){ if(val.indexOf(k.toLowerCase()) !== -1) hits++; });
    correct = hits >= (q.need || 1);
    if(!correct && q.model && val.trim() === q.model.toLowerCase()) correct = true;
    if(!correct && q.model) s.explain = (q.explain||'') + ' Model: ' + q.model;
  }

  s.correct = correct;
  s.checked = true;

  if(correct){
    s.correctCount++;
  } else {
    state.hearts = Math.max(0, state.hearts - 1);
    s.heartShake = true;
    saveState();
  }

  const lsc = document.getElementById('lesson-scroll');
  const lst = lsc ? lsc.scrollTop : 0;
  render();
  const lsc2 = document.getElementById('lesson-scroll');
  if(lsc2) lsc2.scrollTop = lst;

  if(state.hearts <= 0){
    setTimeout(showOutOfHearts, 420);
  }
}

function continueLesson(){
  const s = state.session;
  s.index++;

  if(s.index >= s.questions.length){
    finishLesson();
    return;
  }
  resetQuestionState();
  render();
  const sc = document.getElementById('lesson-scroll');
  if(sc) sc.scrollTop = 0;
}

function finishLesson(){
  const s = state.session;
  if(s.lessonIds) s.lessonIds.forEach(function(id){ state.completed.add(id); });
  else state.completed.add(s.lessonId);
  state.xp += s.correctCount * 2 + 4;
  saveState();
  state.view = 'complete';
  render();
}

app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if(!el) return;

  const action = el.dataset.action;
  const s = state.session;

  /* ---------- global ---------- */
  if(action === 'go-home'){ state.view='home'; render(); return; }
  if(action === 'go-map'){ state.view='home'; render(); return; }
  if(action === 'go-lessons'){ startSlides(state.selectedUnit); return; }
  if(action === 'slide-back'){ if(state.slides && state.slides.idx > 0){ state.slides.idx--; state.slides.dir = 'l'; render(); } return; }
  if(action === 'slide-next'){
    const uid = state.slides.uid; const list = SLIDES[uid];
    if(state.slides.idx < list.length - 1){ state.slides.idx++; state.slides.dir = 'r'; render(); const sc = document.querySelector('.slide-body-scroll'); if(sc) sc.scrollTop = 0; }
    else { const k = mockKey(state.selectedUnit); const u2 = unitById(state.selectedUnit); startCustom(u2.section+' Mock Test', MOCK[k].slice()); }
    return;
  }
  if(action === 'pick-unit'){
    e.preventDefault();
    state.selectedUnit = el.dataset.unit;
    const all = app.querySelectorAll('.unit-btn');
    all.forEach(function(b){ b.classList.toggle('sel', b.dataset.unit === state.selectedUnit); });
    const u = unitById(state.selectedUnit);
    const txt = document.getElementById('unit-sel-text');
    if(txt) txt.innerHTML = 'Selected: <b>'+u.title+'</b> • '+u.lessons.length+' lessons';
    return;
  }
  if(action === 'go-quiz'){ const k = mockKey(state.selectedUnit); const u = unitById(state.selectedUnit); startCustom(u.section+' Mock Test', MOCK[k].slice()); return; }
  if(action === 'go-long'){ state.view='longsets'; renderLongSets(); return; }
  if(action === 'start-set'){ const sets = buildLongSets(); const i = Number(el.dataset.set); const names=['A','B','C','D']; startCustom('Long Quiz Set '+names[i], sets[i].slice()); return; }
  if(action === 'open-lesson'){
    startLesson(el.dataset.lesson);
    return;
  }
  if(action === 'back-to-path'){
    state.view = 'home';
    render();
    return;
  }
  if(action === 'refill'){
    state.hearts = 5;
    saveState();
    document.querySelector('.overlay')?.remove();
    render();
    return;
  }
  if(action === 'close-lesson'){
    state.view = 'home';
    state.session = null;
    render();
    return;
  }

  if(!s) return;

  /* ---------- answering (in-place, no scroll reset) ---------- */
  if(action === 'pick'){
    s.selected = Number(el.dataset.index);
    app.querySelectorAll('.option').forEach(function(o){ o.classList.remove('selected'); });
    el.classList.add('selected');
    const cb = app.querySelector('[data-action="check"]'); if(cb) cb.removeAttribute('disabled');
    return;
  }
  if(action === 'pick-tf'){
    s.selected = el.dataset.value === 'true';
    app.querySelectorAll('.option').forEach(function(o){ o.classList.remove('selected'); });
    el.classList.add('selected');
    const cb2 = app.querySelector('[data-action="check"]'); if(cb2) cb2.removeAttribute('disabled');
    return;
  }
  if(action === 'pick-multi'){
    const i = Number(el.dataset.index);
    const pos = s.multiSel.indexOf(i);
    if(pos >= 0) s.multiSel.splice(pos,1);
    else s.multiSel.push(i);
    el.classList.toggle('selected');
    const cb3 = app.querySelector('[data-action="check"]');
    if(cb3){ if(s.multiSel.length > 0) cb3.removeAttribute('disabled'); else cb3.setAttribute('disabled',''); }
    return;
  }
  if(action === 'pick-word'){
    s.selectedWord = el.dataset.word;
    app.querySelectorAll('.chip-word').forEach(function(o){ o.classList.remove('selected'); });
    el.classList.add('selected');
    const bl = app.querySelector('.blank'); if(bl){ bl.textContent = s.selectedWord; bl.classList.remove('empty'); }
    const cb4 = app.querySelector('[data-action="check"]'); if(cb4) cb4.removeAttribute('disabled');
    return;
  }
  if(action === 'short-chip'){
    const w = el.dataset.word;
    const inp = document.getElementById('short-input');
    if(inp){ inp.value = (inp.value ? inp.value.trim()+' ' : '') + w; s.shortText = inp.value; inp.focus(); }
    else { s.shortText = ((s.shortText||'')+' '+w).trim(); render(); }
    return;
  }

  /* ---------- matching (keep scroll) ---------- */
  function keepScroll(fn){
    const sc = document.getElementById('lesson-scroll');
    const t = sc ? sc.scrollTop : 0;
    fn();
    const sc2 = document.getElementById('lesson-scroll');
    if(sc2) sc2.scrollTop = t;
  }
  if(action === 'match-left'){
    if(s.checked) return;
    s.matchSel = Number(el.dataset.index);
    keepScroll(render);
    return;
  }
  if(action === 'match-right'){
    if(s.checked || s.matchSel === null) return;
    const q = s.questions[s.index];
    const word = el.dataset.word;
    const leftIdx = s.matchSel;
    const expected = q.pairs[leftIdx][1];

    if(expected === word){
      s.matched[leftIdx] = word;
      s.matchSel = null;
      s.matchWrong = null;

      if(Object.keys(s.matched).length === q.pairs.length){
        s.checked = true;
        s.correct = true;
        s.correctCount++;
      }
      keepScroll(render);
    } else {
      s.matchWrong = word;
      keepScroll(render);
      setTimeout(() => {
        if(state.session === s){
          s.matchWrong = null;
          keepScroll(render);
        }
      }, 480);
    }
    return;
  }

  /* ---------- footer ---------- */
  if(action === 'check'){
    checkAnswer();
    return;
  }
  if(action === 'continue'){
    continueLesson();
    return;
  }
});

/* ============================================================
   10. BOOT + PHOTO UPLOAD
   ============================================================ */
app.addEventListener('change', function(e){
  const inp = e.target.closest('input[data-photo]');
  if(!inp || !inp.files || !inp.files[0]) return;
  const idx = inp.getAttribute('data-photo');
  const url = URL.createObjectURL(inp.files[0]);
  state.homePhotos[idx] = url;
  render();
});
app.addEventListener('focusin', function(e){
  if(e.target && e.target.id === 'short-input'){
    setTimeout(function(){
      const sc = document.getElementById('lesson-scroll');
      if(sc) sc.scrollTop = 0;
    }, 350);
  }
});
loadState();
if(!state.selectedUnit) state.selectedUnit = 'u1';
state.view = 'home';
render();
</script>
